workflows:
  rss-ai-project-manager-android:
    name: RSS AI Project Manager Android
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    environment:
      groups:
        - cloudflare
      vars:
        PACKAGE_NAME: "com.riyaz.rssaiprojectmanager"

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Verify Android project
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew --version

      - name: Build debug APK
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew --no-daemon assembleDebug \
            -PversionCode="$BUILD_NUMBER" \
            -PversionName="0.1.$BUILD_NUMBER"

      - name: Verify APK
        script: |
          APK_PATH="$CM_BUILD_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          echo "Verified APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Deploy debug APK to RSS Cloudflare R2
        script: |
          set -euo pipefail

          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
          : "${RSS_R2_BUCKET:?RSS_R2_BUCKET is required}"
          : "${RSS_R2_PREFIX:?RSS_R2_PREFIX is required}"

          APK_PATH="$CM_BUILD_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          APK_NAME="rss-ai-project-manager-$BUILD_NUMBER-debug.apk"
          test -f "$APK_PATH"

          OBJECT_KEY="$RSS_R2_PREFIX/$APK_NAME"

          echo "Installing Cloudflare Wrangler..."
          npm install --global wrangler

          echo "Uploading $APK_PATH to RSS R2: $RSS_R2_BUCKET/$OBJECT_KEY"
          CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" \
          CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" \
            wrangler r2 object put "$RSS_R2_BUCKET/$OBJECT_KEY" \
              --file "$APK_PATH" \
              --remote \
              --content-type application/vnd.android.package-archive

          echo "RSS R2 deployment completed."
          echo "Object: $RSS_R2_BUCKET/$OBJECT_KEY"

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - rsscctvsolution@gmail.com
        notify:
          success: true
          failure: true
