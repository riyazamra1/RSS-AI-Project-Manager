workflows:
  rss-ai-project-manager-android:
    name: RSS AI Project Manager Android
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    environment:
      vars:
        PACKAGE_NAME: "com.riyaz.rssaiprojectmanager"
        RSS_R2_PREFIX: "android/rss-ai-project-manager"

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Verify Android project
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew --version

      - name: Build debug APK
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew --no-daemon assembleDebug             -PversionCode="$BUILD_NUMBER"             -PversionName="0.1.$BUILD_NUMBER"

      - name: Build release APK
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew --no-daemon assembleRelease             -PversionCode="$BUILD_NUMBER"             -PversionName="0.1.$BUILD_NUMBER"

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - rsscctvsolution@gmail.com
        notify:
          success: true
          failure: true

      # RSS infrastructure deployment:
      # Codemagic uploads the generated APK to the existing Cloudflare R2
      # storage used by RSS infrastructure. No Firebase is involved.
      #
      # Configure these as SECRET variables in Codemagic:
      # CLOUDFLARE_API_TOKEN  - R2 Object Read & Write token
      # CLOUDFLARE_ACCOUNT_ID - RSS Cloudflare account ID
      # RSS_R2_BUCKET          - existing RSS R2 bucket name
      scripts:
        - name: Deploy APK to RSS Cloudflare R2
          script: |
            set -euo pipefail

            : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
            : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
            : "${RSS_R2_BUCKET:?RSS_R2_BUCKET is required}"

            APK_PATH="$CM_BUILD_DIR/android/app/build/outputs/apk/release/app-release.apk"
            test -f "$APK_PATH"

            # Keep deployment in the RSS R2 namespace.
            OBJECT_KEY="$RSS_R2_PREFIX/rss-ai-project-manager-$BUILD_NUMBER.apk"

            echo "Installing Cloudflare Wrangler..."
            npm install --global wrangler

            echo "Uploading $APK_PATH to RSS R2: $RSS_R2_BUCKET/$OBJECT_KEY"
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN"             CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"               wrangler r2 object put "$RSS_R2_BUCKET/$OBJECT_KEY"                 --file "$APK_PATH"                 --remote                 --content-type application/vnd.android.package-archive

            echo "RSS R2 deployment completed."
            echo "Object: $RSS_R2_BUCKET/$OBJECT_KEY"
