workflows:
  rss-ai-project-manager-android:
    name: RSS AI Project Manager Android
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    environment:
      vars:
        PACKAGE_NAME: "com.riyaz.rssaiprojectmanager"

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Verify Android project
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew --version

      - name: Build debug APK
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew --no-daemon assembleDebug \
            -PversionCode="$BUILD_NUMBER" \
            -PversionName="0.1.$BUILD_NUMBER"

      - name: Build release APK
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew --no-daemon assembleRelease \
            -PversionCode="$BUILD_NUMBER" \
            -PversionName="0.1.$BUILD_NUMBER"

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - rsscctvsolution@gmail.com
        notify:
          success: true
          failure: true

      # Firebase App Distribution uses the debug APK because Android signs
      # the debug variant automatically. Configure the three secret variables
      # in Codemagic to activate the deployment.
      scripts:
        - name: Deploy signed APK to Firebase App Distribution
          script: |
            set -e

            if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_ANDROID_APP_ID" ]; then
              echo "Firebase deployment credentials are not configured in Codemagic."
              echo "APK artifacts were built successfully; deployment skipped."
              exit 0
            fi

            CREDENTIALS_FILE="$CM_BUILD_DIR/firebase-service-account.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIALS_FILE"
            export GOOGLE_APPLICATION_CREDENTIALS="$CREDENTIALS_FILE"

            APK_PATH="$CM_BUILD_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
            test -f "$APK_PATH"

            RELEASE_NOTES="RSS AI Project Manager build $BUILD_NUMBER"
            if [ -n "$FIREBASE_TESTER_GROUPS" ]; then
              firebase appdistribution:distribute "$APK_PATH" \
                --app "$FIREBASE_ANDROID_APP_ID" \
                --groups "$FIREBASE_TESTER_GROUPS" \
                --release-notes "$RELEASE_NOTES"
            else
              firebase appdistribution:distribute "$APK_PATH" \
                --app "$FIREBASE_ANDROID_APP_ID" \
                --release-notes "$RELEASE_NOTES"
            fi

            rm -f "$CREDENTIALS_FILE"
