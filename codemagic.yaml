workflows:
  rss-ai-project-manager-android:
    name: RSS AI Project Manager Android
    max_build_duration: 60
    # mac_mini_m2 is available without the billing-only Linux X2/X4 machines.
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    environment:
      vars:
        PACKAGE_NAME: "com.riyaz.rssaiprojectmanager"

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Verify Android project
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew --version

      - name: Build debug APK
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew --no-daemon assembleDebug \
            -PversionCode="$BUILD_NUMBER" \
            -PversionName="0.1.$BUILD_NUMBER"

      - name: Build release APK
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew --no-daemon assembleRelease \
            -PversionCode="$BUILD_NUMBER" \
            -PversionName="0.1.$BUILD_NUMBER"

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - rsscctvsolution@gmail.com
        notify:
          success: true
          failure: true

      # Automatic Firebase App Distribution is enabled when the following
      # Codemagic secret variables are configured:
      # FIREBASE_SERVICE_ACCOUNT = Firebase service-account JSON
      # FIREBASE_ANDROID_APP_ID = Firebase Android App ID
      # FIREBASE_TESTER_GROUPS = comma-separated tester group aliases
      scripts:
        - name: Deploy APK to Firebase App Distribution
          script: |
            set -e

            if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_ANDROID_APP_ID" ]; then
              echo "Firebase deployment credentials are not configured in Codemagic."
              echo "Build artifacts remain available; deployment step skipped."
              exit 0
            fi

            CREDENTIALS_FILE="$CM_BUILD_DIR/firebase-service-account.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIALS_FILE"
            export GOOGLE_APPLICATION_CREDENTIALS="$CREDENTIALS_FILE"

            APK_PATH="$CM_BUILD_DIR/android/app/build/outputs/apk/release/app-release.apk"
            if [ ! -f "$APK_PATH" ]; then
              APK_PATH="$CM_BUILD_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
            fi

            RELEASE_NOTES="RSS AI Project Manager build $BUILD_NUMBER"
            GROUP_ARGS=""
            if [ -n "$FIREBASE_TESTER_GROUPS" ]; then
              GROUP_ARGS="--groups $FIREBASE_TESTER_GROUPS"
            fi

            firebase appdistribution:distribute "$APK_PATH" \
              --app "$FIREBASE_ANDROID_APP_ID" \
              --release-notes "$RELEASE_NOTES" \
              $GROUP_ARGS

            rm -f "$CREDENTIALS_FILE"
