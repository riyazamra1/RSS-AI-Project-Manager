services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rss_project_manager}
      POSTGRES_USER: ${POSTGRES_USER:-rss_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rss_manager}
    volumes:
      - rss_pm_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rss_manager} -d ${POSTGRES_DB:-rss_project_manager}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rss-ai-project-manager:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-rss_manager}:${POSTGRES_PASSWORD:-rss_manager}@postgres:5432/${POSTGRES_DB:-rss_project_manager}}
      RAY_EXECUTE_TASKS: ${RAY_EXECUTE_TASKS:-true}
      RSS_RAY_EXECUTE_TASKS: ${RSS_RAY_EXECUTE_TASKS:-true}
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: ["sh", "-c", "python /app/scripts/migrate.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: rss-ai-project-manager:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-rss_manager}:${POSTGRES_PASSWORD:-rss_manager}@postgres:5432/${POSTGRES_DB:-rss_project_manager}}
      RAY_EXECUTE_TASKS: ${RAY_EXECUTE_TASKS:-true}
      RSS_RAY_EXECUTE_TASKS: ${RSS_RAY_EXECUTE_TASKS:-true}
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: rss-ai-project-manager:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-rss_manager}:${POSTGRES_PASSWORD:-rss_manager}@postgres:5432/${POSTGRES_DB:-rss_project_manager}}
      RAY_EXECUTE_TASKS: ${RAY_EXECUTE_TASKS:-true}
      RSS_RAY_EXECUTE_TASKS: ${RSS_RAY_EXECUTE_TASKS:-true}
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  rss_pm_postgres_data:
