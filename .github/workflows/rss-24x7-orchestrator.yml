name: RSS 24x7 Orchestrator

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: rss-24x7-orchestrator
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover and reconcile RSS repositories
        env:
          RSS_AUTOPILOT_GITHUB_TOKEN: ${{ secrets.RSS_GITHUB_TOKEN }}
        run: |
          test -n "$RSS_AUTOPILOT_GITHUB_TOKEN" || { echo 'Missing RSS_GITHUB_TOKEN secret'; exit 10; }
          python3 scripts/discover-projects.py
          git config user.name 'RSS AI Project Manager'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- config/projects.json config/scheduler-state.json; then
            git add config/projects.json config/scheduler-state.json
            git commit -m 'automation: reconcile discovered RSS projects'
            git push
          fi

      - name: Select next runnable task or dynamic project task
        id: task
        shell: python
        run: |
          import json, os
          with open('config/tasks.json', encoding='utf-8') as f:
              data = json.load(f)
          with open('config/projects.json', encoding='utf-8') as f:
              project_data = json.load(f)
          with open('config/scheduler-state.json', encoding='utf-8') as f:
              state = json.load(f)

          tasks = data.get('tasks', [])
          by_id = {t['id']: t for t in tasks}
          projects = {p['id']: p for p in project_data.get('projects', [])}
          selected = None

          for task in sorted(tasks, key=lambda x: (x.get('priority', 9999), x.get('id', ''))):
              if task.get('status') not in ('pending', 'in_progress'):
                  continue
              if task.get('human_action_required'):
                  continue
              deps = task.get('depends_on', [])
              if any(by_id.get(dep, {}).get('status') != 'completed' for dep in deps):
                  continue
              project = projects.get(task.get('project'), {})
              if not project.get('enabled') or not project.get('repository'):
                  continue
              selected = task
              break

          dynamic = False
          if not selected:
              active = [p for p in projects.values() if p.get('enabled') and not p.get('archived')]
              active.sort(key=lambda p: (p.get('priority', 9999), p.get('repository', '').lower()))
              if not active:
                  raise SystemExit('No active discovered RSS projects.')
              cursor = int(state.get('cursor', 0)) % len(active)
              project = active[cursor]
              dynamic = True
              selected = {
                  'id': f"dynamic-{project['id']}",
                  'title': f"Autonomous maintenance: inspect CI, build and tests for {project['name']} and implement one small safe improvement",
                  'project': project['id'],
                  'priority': 10000,
              }

          repository = projects[selected['project']]['repository']
          print(f"Selected {'dynamic' if dynamic else 'roadmap'} task: {selected['id']} -> {repository}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('run=true\n')
              out.write(f"task_id={selected['id']}\n")
              out.write(f"repository={repository}\n")
              out.write(f"title={selected['title']}\n")
              out.write(f"dynamic={'true' if dynamic else 'false'}\n")

      - name: Setup Node.js
        if: steps.task.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gemini CLI
        if: steps.task.outputs.run == 'true'
        run: npm install -g @google/gemini-cli@latest

      - name: Run RSS AI DevOps execution engine
        if: steps.task.outputs.run == 'true'
        env:
          RSS_AUTOPILOT_GITHUB_TOKEN: ${{ secrets.RSS_GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RSS_AUTOPILOT_AGENT: gemini
        run: |
          test -n "$RSS_AUTOPILOT_GITHUB_TOKEN" || { echo 'Missing RSS_GITHUB_TOKEN secret'; exit 10; }
          test -n "$GEMINI_API_KEY" || { echo 'Missing GEMINI_API_KEY secret'; exit 11; }
          bash scripts/autopilot.sh "${{ steps.task.outputs.repository }}" "${{ steps.task.outputs.title }}"

      - name: Record successful task handoff and advance dynamic scheduler
        if: success() && steps.task.outputs.run == 'true'
        env:
          TASK_ID: ${{ steps.task.outputs.task_id }}
          DYNAMIC: ${{ steps.task.outputs.dynamic }}
        run: |
          python3 - <<'PY'
          import json, os
          if os.environ['DYNAMIC'] == 'true':
              path = 'config/scheduler-state.json'
              with open(path, encoding='utf-8') as f:
                  state = json.load(f)
              state['cursor'] = int(state.get('cursor', 0)) + 1
              state['last_task'] = os.environ['TASK_ID']
              state['last_automation'] = os.environ.get('GITHUB_RUN_ID')
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(state, f, indent=2)
                  f.write('\n')
          else:
              path = 'config/tasks.json'
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              for task in data.get('tasks', []):
                  if task.get('id') == os.environ['TASK_ID']:
                      task['status'] = 'in_review'
                      task['last_automation'] = os.environ.get('GITHUB_RUN_ID')
                      break
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2)
                  f.write('\n')
          PY
          git config user.name 'RSS AI Project Manager'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/tasks.json config/scheduler-state.json
          git diff --cached --quiet || git commit -m "automation: advance $TASK_ID"
          git push

      - name: Failure diagnostics
        if: failure()
        run: |
          echo "=== RSS AI Project Manager failure diagnostics ==="
          echo "Run: $GITHUB_RUN_ID"
          echo "SHA: $GITHUB_SHA"
          echo "Task: ${{ steps.task.outputs.task_id }}"
          echo "Repository: ${{ steps.task.outputs.repository }}"
          echo "Dynamic: ${{ steps.task.outputs.dynamic }}"
          echo "Task selected: ${{ steps.task.outputs.run }}"
          echo "GitHub CLI: $(gh --version | head -n 1)"
          echo "Node: $(node --version)"
          echo "Python: $(python3 --version)"
          if command -v gemini >/dev/null 2>&1; then gemini --version || true; else echo "Gemini CLI: NOT INSTALLED"; fi
          bash -n scripts/autopilot.sh scripts/agent-router.sh
          python3 -m py_compile scripts/discover-projects.py
          echo "Controller files:"
          git status --short
          echo "=== End diagnostics ==="

      - name: Automation heartbeat
        if: always()
        run: |
          echo "RSS 24x7 orchestrator heartbeat: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Task: ${{ steps.task.outputs.task_id }}"
          echo "Repository: ${{ steps.task.outputs.repository }}"
          echo "Dynamic: ${{ steps.task.outputs.dynamic }}"
          echo "Run: ${{ steps.task.outputs.run }}"
