name: RSS 24x7 Orchestrator

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: rss-24x7-orchestrator
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select next runnable task
        id: task
        shell: python
        run: |
          import json, os
          with open('config/tasks.json', encoding='utf-8') as f:
              data = json.load(f)
          tasks = data.get('tasks', [])
          by_id = {t['id']: t for t in tasks}
          selected = None
          for task in sorted(tasks, key=lambda x: (x.get('priority', 9999), x.get('id', ''))):
              if task.get('status') not in ('pending', 'in_progress'):
                  continue
              if task.get('human_action_required'):
                  continue
              deps = task.get('depends_on', [])
              if any(by_id.get(dep, {}).get('status') != 'completed' for dep in deps):
                  continue
              selected = task
              break
          if not selected:
              print('No runnable task.')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('run=false\n')
              raise SystemExit(0)
          print(f"Selected {selected['id']} -> {selected['repository']}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('run=true\n')
              out.write(f"task_id={selected['id']}\n")
              out.write(f"repository={selected['repository']}\n")
              out.write(f"title={selected['title']}\n")

      - name: Setup Node.js
        if: steps.task.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gemini CLI
        if: steps.task.outputs.run == 'true'
        run: npm install -g @google/gemini-cli@latest

      - name: Run RSS AI DevOps execution engine
        if: steps.task.outputs.run == 'true'
        env:
          RSS_AUTOPILOT_GITHUB_TOKEN: ${{ secrets.RSS_AUTOPILOT_GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RSS_AUTOPILOT_AGENT: gemini
        run: |
          test -n "$RSS_AUTOPILOT_GITHUB_TOKEN" || { echo 'Missing RSS_AUTOPILOT_GITHUB_TOKEN secret'; exit 10; }
          test -n "$GEMINI_API_KEY" || { echo 'Missing GEMINI_API_KEY secret'; exit 11; }
          bash scripts/autopilot.sh "${{ steps.task.outputs.repository }}" "${{ steps.task.outputs.title }}"

      - name: Record successful task handoff
        if: success() && steps.task.outputs.run == 'true'
        env:
          TASK_ID: ${{ steps.task.outputs.task_id }}
        run: |
          python3 - <<'PY'
          import json, os
          path = 'config/tasks.json'
          with open(path, encoding='utf-8') as f:
              data = json.load(f)
          for task in data.get('tasks', []):
              if task.get('id') == os.environ['TASK_ID']:
                  task['status'] = 'in_review'
                  task['last_automation'] = os.environ.get('GITHUB_RUN_ID')
                  break
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY
          git config user.name 'RSS AI Project Manager'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/tasks.json
          git commit -m "automation: hand off $TASK_ID to review"
          git push

      - name: Automation heartbeat
        if: always()
        run: |
          echo "RSS 24x7 orchestrator heartbeat: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Task: ${{ steps.task.outputs.task_id }}"
          echo "Repository: ${{ steps.task.outputs.repository }}"
          echo "Run: ${{ steps.task.outputs.run }}"
