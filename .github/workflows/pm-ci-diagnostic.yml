name: PM CI Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Capture CI stages
        shell: bash
        run: |
          set +e
          mkdir -p diagnostic
          run_stage() {
            name="$1"
            shift
            echo "===== $name =====" | tee -a diagnostic/report.txt
            "$@" >"diagnostic/$name.out" 2>&1
            code=$?
            echo "exit_code=$code" | tee -a diagnostic/report.txt
            cat "diagnostic/$name.out" >> diagnostic/report.txt
            echo >> diagnostic/report.txt
          }

          cd backend
          run_stage install python -m pip install --upgrade pip
          run_stage deps pip install -r requirements.txt
          run_stage compile python -m compileall -q app
          run_stage import env PYTHONPATH=. python -c "from app.main import app; assert app.title == 'RSS AI Project Manager'"
          run_stage services python -m py_compile app/services/task_runner.py app/services/ray_client.py
          run_stage tests env PYTHONPATH=. RSS_RAY_EXECUTE_TASKS=false python -m unittest discover -s tests -p 'test_*.py' -v
          run_stage health env PYTHONPATH=. AUTO_CHAT_SCHEDULER_ENABLED=false python -c "from fastapi.testclient import TestClient; from app.main import app; r=TestClient(app).get('/health'); assert r.status_code == 200; assert r.json()['status'] == 'ok'"

          cd ..
          echo "===== SUMMARY =====" >> diagnostic/report.txt
          grep -E '^(=====|exit_code=)' diagnostic/report.txt || true

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm-ci-diagnostic
          path: diagnostic/
          retention-days: 3
