name: RSS Core RAY Production Verify

on:
  workflow_dispatch:

jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify RSS Core -> RAY
        env:
          RSS_CORE_URL: ${{ secrets.RSS_CORE_URL }}
          RSS_CORE_API_TOKEN: ${{ secrets.RSS_CORE_API_TOKEN }}
          RAY_WORKER_URL: ${{ secrets.RAY_WORKER_URL }}
          RAY_WORKER_TOKEN: ${{ secrets.RAY_WORKER_TOKEN }}
        run: python3 scripts/production_verify.py
