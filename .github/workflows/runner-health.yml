name: RSS Actions Runner Health

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Runner smoke test
        run: |
          echo "RSS Actions runner started successfully"
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          python3 --version
          node --version
