name: RSS AI Project Manager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Set up Node.js for portal validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate PM portal JavaScript syntax
        working-directory: .
        run: node --check web/app.js

      - name: Compile backend
        run: python -m compileall -q app

      - name: Import FastAPI application
        env:
          PYTHONPATH: .
        run: python -c "from app.main import app; assert app.title == 'RSS AI Project Manager'"

      - name: Compile execution services
        run: python -m py_compile app/services/task_runner.py app/services/ray_client.py

      - name: RAY execution contract tests
        env:
          PYTHONPATH: .
          RSS_RAY_EXECUTE_TASKS: "false"
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Health endpoint smoke test
        env:
          PYTHONPATH: .
          AUTO_CHAT_SCHEDULER_ENABLED: "false"
        run: python -c "from fastapi.testclient import TestClient; from app.main import app; r=TestClient(app).get('/health'); assert r.status_code == 200; assert r.json()['status'] == 'ok'"
